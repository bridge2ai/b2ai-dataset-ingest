id: https://w3id.org/bridge2ai/b2ai-dataset-ingest/gates/b2ai-aireadi-observation
name: b2ai-aireadi-observation
description: Value gates for one SSSOM mapping set, authored as LinkML class rules. The SSSOM file is
  GENERATED from this schema by scripts/gates_to_sssom.py; edit here, regenerate, commit both.
imports:
- linkml:types
- gate_base
prefixes:
  linkml: https://w3id.org/linkml/
  b2ai: https://github.com/sujaypatil96/b2ai-dataset-ingest#
  HP: http://purl.obolibrary.org/obo/HP_
  ECO: http://purl.obolibrary.org/obo/ECO_
  skos: http://www.w3.org/2004/02/skos/core#
  semapv: https://w3id.org/semapv/vocab/
  github: https://github.com/
  obo: http://purl.obolibrary.org/obo/
default_prefix: b2ai
default_range: string
annotations:
  sssom_header: |
    curie_map:
      b2ai: https://github.com/sujaypatil96/b2ai-dataset-ingest#
      HP: http://purl.obolibrary.org/obo/HP_
      ECO: http://purl.obolibrary.org/obo/ECO_
      skos: http://www.w3.org/2004/02/skos/core#
      semapv: https://w3id.org/semapv/vocab/
      github: https://github.com/
      obo: http://purl.obolibrary.org/obo/
    mapping_set_id: https://github.com/sujaypatil96/b2ai-dataset-ingest/mappings/b2ai-aireadi-observation.sssom.tsv
    mapping_set_version: '2026-10-22'
    license: https://creativecommons.org/publicdomain/zero/1.0/
    mapping_provider: https://github.com/sujaypatil96/b2ai-dataset-ingest
    creator_id:
      - github:justaddcoffee
    subject_source: aireadi/1.0.0
    object_source: obo:hp
    object_source_version: hp/releases/2026-02-16
    mapping_tool: 'oaklib (sqlite:obo:hp); every object_id verified against the pinned hp.json (obographs)'
    mapping_date: '2026-09-23'
    comment: AI-READI clinical_data/observation.csv items mapped to HPO. EVERY ROW IS SELF-REPORT (evidence_code ECO:0006160), so the questionnaire rules apply unchanged - only exactMatch and broadMatch rows gate, every gate is bounded (in {..} or >=n & <=m, never an open >=, so a refusal code 555/777/888/999 cannot fire it), and ONLY PRESENCE is asserted, because a low answer denies the symptom within the instrument's recall window and not the phenotype (docs/mapping-conventions.md, Why absence is not asserted). Subjects are b2ai:observation.<redcap_variable>; the OMOP table qualifier matters - the same variables in condition_occurrence are asserted conditions, mapped to MONDO in b2ai-aireadi-conditions. Answer values are the stored value_as_number; ces5 and ces8 are stored already reverse-scored (3 = rarely) so higher always means more distress. GATED ROWS - the CES-D-10 items and total, which config/aireadi/observation/cesd10.yaml ingests. Cut-points follow the repo rule of comparing answer LABELS, not integers - CES-D's '1-2 days of the past week' is the endorsement PHQ-9 gates at 'Several days' - and are marked pending the same clinical review the Voice set had; an earlier adversarial review disputed direction and cut-point on several proposed CES-D rows, and each row records its reasoning so a reviewer can rule on it. UNGATED ROWS, deliberately - the medical-history grid (mhoccur_*, mhterm_*, mh_*), falls, and the vision-function items are mapped term-to-term with the intended gate written in the comment, but carry no when_value because scope.yaml does not ingest them and a gated row must name an emitted assay (tests/test_config_mappings.py). Landing those gates is a config change plus filling the column, nothing else. NOT MAPPED, and why - ces9 'I felt lonely' (no HPO term for loneliness); PAID-5 (distress about living with diabetes is a disease-specific appraisal, not a phenotype - see paid5.yaml); mhoccur_ms (a disease with no HPO phenotype term; MONDO only); diet, substance-use, self-management, family-history, medication, social-determinant, imaging-flag and administrative families (not phenotypes of the participant).
    extension_definitions:
      - slot_name: when_value
        property: b2ai:when_value
        type_hint: xsd:string
      - slot_name: evidence_code
        property: b2ai:evidence_code
        type_hint: xsd:string
  sssom_columns: "subject_id\tsubject_label\tpredicate_id\tobject_id\tobject_label\tmapping_justification\t\
    confidence\tcomment\twhen_value\tevidence_code"
classes:
  ObservationCes1:
    is_a: GatedItem
    class_uri: b2ai:observation.ces1
    title: Bothered by things that are not usually bothersome
    rules:
    - title: Irritability, present
      preconditions:
        slot_conditions:
          value:
            any_of:
            - equals_number: 2
            - equals_number: 3
      postconditions:
        slot_conditions:
          phenotype:
            equals_string: HP:0000737
          status:
            equals_string: present
      annotations:
        predicate_id: skos:broadMatch
        object_label: Irritability
        mapping_justification: semapv:ManualMappingCuration
        confidence: '0.7'
        comment: 'being bothered by things that usually do not bother one is a facet of irritability,
          so the HPO term is broader; gated one rung higher (3+ days) than the clearer items. CES-D-10,
          past-week frequency 0-3; 1 = ''Some or a little of the time (1-2 days)'' is the same endorsement
          PHQ-9 gates at ''Several days'' over two weeks, so the gate is in {1,2,3} (bounded, never >=,
          so a refusal code cannot fire it). Presence only: the recall window is one week'
        evidence_code: ECO:0006160
  ObservationCes2:
