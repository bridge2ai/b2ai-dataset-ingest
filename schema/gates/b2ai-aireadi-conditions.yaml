          confidence: '0.95'
          comment: MONDO exact synonym "prediabetes"
  ConditionOccurrenceMhoccurGi:
    is_a: GatedItem
    class_uri: b2ai:condition_occurrence.mhoccur_gi
    title: Disorder of digestive system
    exact_mappings:
