          mapping_justification: semapv:ManualMappingCuration
          confidence: '0.95'
          comment: the item asks "Cataracts (in one or both eyes)", i.e. cataract generally; the OMOP
            concept name "Bilateral cataracts" is narrower than what was asked
  ConditionOccurrenceMhtermPredm:
