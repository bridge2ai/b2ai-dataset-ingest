          phenotype:
            equals_string: HP:0020062
          status:
            equals_string: present
      annotations:
        predicate_id: skos:relatedMatch
        object_label: Decreased hemoglobin concentration
        mapping_justification: semapv:ManualMappingCuration
        confidence: '0.85'
        comment: 'THE ITEM KEY IS MISLEADING: concept 3000963 / LOINC 718-7 is total hemoglobin (g/dL),
          not HbA1c (that is import_hba1c). ABIM hemoglobin F 12-16, M 14-18 g/dL; sex-blind gate: Individual.sex
          is redacted in the public release, so the present pole fires only where the value is abnormal
          for BOTH sexes and the absent pole only where it is normal for both; the band between asserts
          nothing. Tighten per sex when sex ships; loinc2hpo 718-7 L -> HP:0020062; its H target HP:0020063
          is OBSOLETE in hp 2026-02-16 and is replaced by HP:0001900'
        evidence_code: ECO:0007307
        loinc_id: 718-7
        l2h_outcome: L
        threshold_source: ABIM Laboratory Test Reference Ranges, January 2025 (site CBC has no published
