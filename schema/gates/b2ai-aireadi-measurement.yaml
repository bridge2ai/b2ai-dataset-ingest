          phenotype:
            equals_string: HP:0031851
          status:
            equals_string: present
      annotations:
        predicate_id: skos:relatedMatch
        object_label: Reduced hematocrit
        mapping_justification: semapv:ManualMappingCuration
        confidence: '0.85'
        comment: 'ABIM hematocrit F 37-47%, M 42-50%; sex-blind gate: Individual.sex is redacted in the
          public release, so the present pole fires only where the value is abnormal for BOTH sexes and
          the absent pole only where it is normal for both; the band between asserts nothing. Tighten
          per sex when sex ships; loinc2hpo 20570-8 L/H'
        evidence_code: ECO:0007307
        loinc_id: 20570-8
        l2h_outcome: L
        threshold_source: ABIM Laboratory Test Reference Ranges, January 2025 (site CBC has no published
          AI-READI interval)
