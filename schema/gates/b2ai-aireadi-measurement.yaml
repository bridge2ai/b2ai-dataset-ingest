    is_a: GatedItem
    class_uri: b2ai:measurement.lbscat_a1c
    title: Hemoglobin [Mass/volume] in Blood
    rules:
    - title: Decreased hemoglobin concentration, present
      preconditions:
        slot_conditions:
          value:
            none_of:
            - minimum_value: 12
      postconditions:
