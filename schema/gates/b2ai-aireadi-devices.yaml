id: https://w3id.org/bridge2ai/b2ai-dataset-ingest/gates/b2ai-aireadi-devices
name: b2ai-aireadi-devices
description: Value gates for one SSSOM mapping set, authored as LinkML class rules. The SSSOM file is
  GENERATED from this schema by scripts/gates_to_sssom.py; edit here, regenerate, commit both.
imports:
- linkml:types
- gate_base
prefixes:
  linkml: https://w3id.org/linkml/
  b2ai: https://github.com/sujaypatil96/b2ai-dataset-ingest#
  HP: http://purl.obolibrary.org/obo/HP_
  ECO: http://purl.obolibrary.org/obo/ECO_
  skos: http://www.w3.org/2004/02/skos/core#
  semapv: https://w3id.org/semapv/vocab/
  github: https://github.com/
  obo: http://purl.obolibrary.org/obo/
default_prefix: b2ai
default_range: string
annotations:
  sssom_header: |
    curie_map:
      b2ai: https://github.com/sujaypatil96/b2ai-dataset-ingest#
      HP: http://purl.obolibrary.org/obo/HP_
      ECO: http://purl.obolibrary.org/obo/ECO_
      skos: http://www.w3.org/2004/02/skos/core#
      semapv: https://w3id.org/semapv/vocab/
      github: https://github.com/
      obo: http://purl.obolibrary.org/obo/
    mapping_set_id: https://github.com/sujaypatil96/b2ai-dataset-ingest/mappings/b2ai-aireadi-devices.sssom.tsv
    mapping_set_version: '2026-10-22'
    license: https://creativecommons.org/publicdomain/zero/1.0/
    mapping_provider: https://github.com/sujaypatil96/b2ai-dataset-ingest
    creator_id:
      - github:justaddcoffee
    subject_source: aireadi/1.0.0
    object_source: obo:hp
    object_source_version: hp/releases/2026-02-16
    mapping_tool: 'manual; every object_id verified against the pinned hp.json (obographs) by b2ai-ingest validate-mappings'
    mapping_date: '2026-10-22'
    comment: AI-READI device-derived measurements mapped to HPO. Subjects are b2ai:cardiac_ecg.<manifest column> (the Philips 12-lead device's own interval and rate measurements, one row per recording, config/aireadi/modalities/cardiac_ecg.yaml) and b2ai:wearable_blood_glucose.<statistic> (window summaries over the 10-day Dexcom G6 series, config/aireadi/modalities/wearable_blood_glucose.yaml). EVERY ROW IS A MEASURED-VALUE MAPPING (evidence_code ECO:0007307) with a skos:relatedMatch predicate and a reference-range gate, on the same terms as b2ai-aireadi-measurement.sssom.tsv. THRESHOLDS - ECG rate and PR per the AHA/ACCF/HRS 2009 recommendations for the standardization and interpretation of the electrocardiogram (sinus bradycardia < 60, sinus tachycardia > 100 bpm; first-degree AV block PR > 200 ms, normal 120-200); QTc per the same (prolonged > 450 ms men, > 460 ms women), stratified by sex via when_subject with a sex-blind fallback (present only where abnormal for both sexes, > 460; absent only where normal for both, <= 450). The device's QTc formula is Bazett per the Philips DXL algorithm. NOT MAPPED - QRS duration (bundle-branch block is a morphology diagnosis, not a duration cut-point), the axes, and the device's own interpretation strings, which AI-READI states are not physician-reviewed. CGM - the glucose management indicator gates Hyperglycemia at the international consensus target (GMI >= 7.0 %, Battelino et al. 2019); confidence 0.7 pending clinical review, present pole only, since a 10-day window at target does not rule out hyperglycemia at other times. Wearable (Garmin) summaries derive no feature.
    extension_definitions:
      - slot_name: when_value
        property: b2ai:when_value
        type_hint: xsd:string
      - slot_name: when_subject
        property: b2ai:when_subject
        type_hint: xsd:string
      - slot_name: evidence_code
        property: b2ai:evidence_code
        type_hint: xsd:string
      - slot_name: loinc_id
        property: b2ai:loinc_id
        type_hint: xsd:string
      - slot_name: threshold_source
        property: b2ai:threshold_source
        type_hint: xsd:string
  sssom_columns: "subject_id\tsubject_label\tpredicate_id\tpredicate_modifier\tobject_id\tobject_label\t\
    mapping_justification\tconfidence\tcomment\twhen_value\twhen_subject\tevidence_code\tloinc_id\tthreshold_source"
classes:
  CardiacEcgRate:
    is_a: GatedItem
    class_uri: b2ai:cardiac_ecg.Rate
    title: Heart rate
    rules:
    - title: Bradycardia, present
      preconditions:
        slot_conditions:
          value:
            none_of:
            - minimum_value: 60
      postconditions:
        slot_conditions:
          phenotype:
            equals_string: HP:0001662
          status:
            equals_string: present
      annotations:
        predicate_id: skos:relatedMatch
        object_label: Bradycardia
        mapping_justification: semapv:ManualMappingCuration
        confidence: '0.85'
        comment: ventricular rate from the 12-lead recording, supine; < 60 bpm
        evidence_code: ECO:0007307
        loinc_id: 8867-4
        threshold_source: AHA/ACCF/HRS 2009 ECG standardization recommendations
    - title: Tachycardia, present
      preconditions:
        slot_conditions:
          value:
            none_of:
            - maximum_value: 100
      postconditions:
        slot_conditions:
          phenotype:
            equals_string: HP:0001649
          status:
            equals_string: present
      annotations:
        predicate_id: skos:relatedMatch
        object_label: Tachycardia
        mapping_justification: semapv:ManualMappingCuration
        confidence: '0.85'
        comment: ventricular rate from the 12-lead recording, supine; > 100 bpm
        evidence_code: ECO:0007307
        loinc_id: 8867-4
        threshold_source: AHA/ACCF/HRS 2009 ECG standardization recommendations
    - title: Bradycardia, absent
      preconditions:
        slot_conditions:
          value:
            minimum_value: 60
            maximum_value: 100
      postconditions:
        slot_conditions:
          phenotype:
            equals_string: HP:0001662
          status:
            equals_string: excluded
      annotations:
        predicate_id: skos:relatedMatch
        object_label: Bradycardia
        mapping_justification: semapv:ManualMappingCuration
        confidence: '0.85'
        comment: rate within 60-100 bpm at this recording
        evidence_code: ECO:0007307
        loinc_id: 8867-4
        threshold_source: AHA/ACCF/HRS 2009 ECG standardization recommendations
    - title: Tachycardia, absent
      preconditions:
        slot_conditions:
          value:
            minimum_value: 60
            maximum_value: 100
      postconditions:
        slot_conditions:
          phenotype:
            equals_string: HP:0001649
          status:
            equals_string: excluded
      annotations:
        predicate_id: skos:relatedMatch
        object_label: Tachycardia
        mapping_justification: semapv:ManualMappingCuration
        confidence: '0.85'
        comment: rate within 60-100 bpm at this recording
        evidence_code: ECO:0007307
        loinc_id: 8867-4
        threshold_source: AHA/ACCF/HRS 2009 ECG standardization recommendations
  CardiacEcgPR:
    is_a: GatedItem
    class_uri: b2ai:cardiac_ecg.PR
    title: P-R Interval
    rules:
    - title: Prolonged PR interval, present
      preconditions:
        slot_conditions:
          value:
            none_of:
            - maximum_value: 200
      postconditions:
        slot_conditions:
          phenotype:
            equals_string: HP:0012248
          status:
            equals_string: present
      annotations:
        predicate_id: skos:relatedMatch
        object_label: Prolonged PR interval
        mapping_justification: semapv:ManualMappingCuration
        confidence: '0.85'
        comment: PR > 200 ms is first-degree AV block by definition; the interval term is used rather
          than the block term because the device measures the interval
        evidence_code: ECO:0007307
        loinc_id: 8625-6
        threshold_source: AHA/ACCF/HRS 2009 ECG standardization recommendations
    - title: Prolonged PR interval, absent
      preconditions:
        slot_conditions:
          value:
            minimum_value: 120
            maximum_value: 200
      postconditions:
        slot_conditions:
          phenotype:
            equals_string: HP:0012248
          status:
            equals_string: excluded
      annotations:
        predicate_id: skos:relatedMatch
        object_label: Prolonged PR interval
        mapping_justification: semapv:ManualMappingCuration
        confidence: '0.85'
        comment: PR within 120-200 ms at this recording
        evidence_code: ECO:0007307
        loinc_id: 8625-6
        threshold_source: AHA/ACCF/HRS 2009 ECG standardization recommendations
  CardiacEcgQTc:
    is_a: GatedItem
    class_uri: b2ai:cardiac_ecg.QTc
    title: Q-T interval corrected
    rules:
    - title: Prolonged QT interval, present
      preconditions:
        slot_conditions:
          value:
            none_of:
            - maximum_value: 460
      postconditions:
        slot_conditions:
          phenotype:
            equals_string: HP:0001657
          status:
            equals_string: present
      annotations:
        predicate_id: skos:relatedMatch
        object_label: Prolonged QT interval
        mapping_justification: semapv:ManualMappingCuration
        confidence: '0.85'
        comment: 'sex-blind gate: prolonged > 450 ms men, > 460 ms women; fires only where abnormal for
          both sexes'
        evidence_code: ECO:0007307
        loinc_id: 8636-3
        threshold_source: AHA/ACCF/HRS 2009 ECG standardization recommendations
    - title: Prolonged QT interval, absent
      preconditions:
        slot_conditions:
          value:
            maximum_value: 450
      postconditions:
        slot_conditions:
          phenotype:
            equals_string: HP:0001657
          status:
            equals_string: excluded
      annotations:
        predicate_id: skos:relatedMatch
        object_label: Prolonged QT interval
        mapping_justification: semapv:ManualMappingCuration
        confidence: '0.85'
        comment: 'sex-blind gate: absent only where normal for both sexes (<= 450 ms)'
        evidence_code: ECO:0007307
        loinc_id: 8636-3
        threshold_source: AHA/ACCF/HRS 2009 ECG standardization recommendations
    - title: Prolonged QT interval, present, sex == "MALE"
      preconditions:
        slot_conditions:
          value:
            none_of:
            - maximum_value: 450
          sex:
            equals_string: MALE
      postconditions:
        slot_conditions:
          phenotype:
            equals_string: HP:0001657
          status:
            equals_string: present
      annotations:
        predicate_id: skos:relatedMatch
        object_label: Prolonged QT interval
        mapping_justification: semapv:ManualMappingCuration
        confidence: '0.9'
        comment: 'per-sex gate: prolonged > 450 ms in men'
        evidence_code: ECO:0007307
        loinc_id: 8636-3
        threshold_source: AHA/ACCF/HRS 2009 ECG standardization recommendations
    - title: Prolonged QT interval, absent, sex == "MALE"
      preconditions:
        slot_conditions:
          value:
            maximum_value: 450
          sex:
            equals_string: MALE
      postconditions:
        slot_conditions:
          phenotype:
            equals_string: HP:0001657
          status:
            equals_string: excluded
      annotations:
        predicate_id: skos:relatedMatch
        object_label: Prolonged QT interval
        mapping_justification: semapv:ManualMappingCuration
        confidence: '0.9'
        comment: 'per-sex gate: within normal (<= 450 ms) in men'
        evidence_code: ECO:0007307
        loinc_id: 8636-3
        threshold_source: AHA/ACCF/HRS 2009 ECG standardization recommendations
    - title: Prolonged QT interval, present, sex == "FEMALE"
      preconditions:
        slot_conditions:
          value:
            none_of:
            - maximum_value: 460
          sex:
            equals_string: FEMALE
      postconditions:
        slot_conditions:
          phenotype:
            equals_string: HP:0001657
          status:
            equals_string: present
      annotations:
        predicate_id: skos:relatedMatch
        object_label: Prolonged QT interval
        mapping_justification: semapv:ManualMappingCuration
        confidence: '0.9'
        comment: 'per-sex gate: prolonged > 460 ms in women'
        evidence_code: ECO:0007307
        loinc_id: 8636-3
        threshold_source: AHA/ACCF/HRS 2009 ECG standardization recommendations
    - title: Prolonged QT interval, absent, sex == "FEMALE"
      preconditions:
        slot_conditions:
          value:
            maximum_value: 460
          sex:
            equals_string: FEMALE
      postconditions:
        slot_conditions:
          phenotype:
            equals_string: HP:0001657
          status:
            equals_string: excluded
      annotations:
        predicate_id: skos:relatedMatch
        object_label: Prolonged QT interval
        mapping_justification: semapv:ManualMappingCuration
        confidence: '0.9'
        comment: 'per-sex gate: within normal (<= 460 ms) in women'
        evidence_code: ECO:0007307
        loinc_id: 8636-3
        threshold_source: AHA/ACCF/HRS 2009 ECG standardization recommendations
  WearableBloodGlucoseCgmGmi:
    is_a: GatedItem
    class_uri: b2ai:wearable_blood_glucose.cgm_gmi
    title: Glucose management indicator
    rules:
    - title: Hyperglycemia, present
      preconditions:
        slot_conditions:
          value:
            minimum_value: 7
      postconditions:
        slot_conditions:
          phenotype:
            equals_string: HP:0003074
          status:
            equals_string: present
      annotations:
        predicate_id: skos:relatedMatch
        object_label: Hyperglycemia
        mapping_justification: semapv:ManualMappingCuration
        confidence: '0.7'
        comment: GMI at or above the consensus target of 7.0 % over the wear window; PENDING CLINICAL
          REVIEW of the cut-point; present pole only
        evidence_code: ECO:0007307
        loinc_id: 97506-0
        threshold_source: 'International consensus on time in range (Battelino et al., Diabetes Care 2019):
          GMI target < 7 %'
