[project]
name = "b2ai-dataset-ingest"
version = "0.0.1"
description = "Ingest Bridge2AI datasets (phenotype tables) into GA4GH Phenopackets via a target-neutral intermediate model with pluggable emitters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sujay Patil", email = "sujaysanjeev.patil@gmail.com" }]
keywords = ["bridge2ai", "phenopackets", "ga4gh", "ingest", "phenotype"]
dependencies = [
    "phenopackets>=2.0.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
]

# NOTE: `oaklib` is NOT a core runtime dependency — the ingest pipeline never needs it
# (config `{id, label}` pairs are the source of truth, and its transitive tree is large).
# It lives in the optional `validation` extra below, used by ontology/terms.py to fill/verify
# labels at emit time and by ontology/sssom_validate.py to check the HPO mappings offline.
# Enable with `uv sync --extra validation` (or `pip install '.[validation]'`).

[project.scripts]
b2ai-ingest = "b2ai_dataset_ingest.cli:app"

# The `scripts/` analyses over emitted phenopackets are exploratory tooling, not part
# of the pipeline, and deliberately live outside the package so they do not ship in the
# wheel. This is an extra rather than an ad-hoc `uv run --with ...` because runs against
# the source data go through an account that cannot write uv's caches — the deps have to
# already be in .venv. See scripts/ingest_and_cluster_real.sh.
[project.optional-dependencies]
validation = [
    "oaklib>=0.7.2",
]
analysis = [
    "matplotlib>=3.8",
    "pandas>=2.0",
]
# Ontology graph access for `b2ai-ingest voice --normalize-hpo`. Deliberately the
# same library stratiphy uses, reading the same hp.json, so a term is never collapsed
# against a different graph than the one the clustering reasons over. `clustering`
# already pulls it in transitively; this extra is for normalising without clustering.
hpo = [
    "hpo-toolkit>=0.8.1",
]
# Phenotype-driven clustering. Its own extra rather than folded into `analysis`
# because it is heavy (hpo-toolkit, scikit-learn, scipy, statsmodels) and the HPO
# profiler must stay installable without it.
clustering = [
    "stratiphy>=0.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/b2ai_dataset_ingest"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Typer's idiom uses function calls (Option/Argument) as parameter defaults.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
