name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest -q

      # The CLI is deliberately not unit-tested, so CI exercises it. Runs against the
      # committed hand-authored fixture only: nothing licensed may be fetched here.
      - name: Smoke-test the AI-READI CLI against the committed fixture
        run: |
          uv run b2ai-ingest validate-aireadi -i tests/data/aireadi -c config/aireadi
          uv run b2ai-ingest aireadi -i tests/data/aireadi -c config/aireadi -o "$RUNNER_TEMP/aireadi"
          test "$(ls "$RUNNER_TEMP"/aireadi/*.json | wc -l)" -eq 4
          ! grep -q '"TODO"' "$RUNNER_TEMP"/aireadi/*.json

  validate-mappings:
    # Enforces the B2AI -> HPO SSSOM guardrail: installs the `validation` extra (oaklib) so the
    # HPO existence/label checks actually run and a hallucinated/obsolete/mislabeled term fails CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies (with validation extra)
        run: uv sync --extra validation

      # The validator checks each file against the ontology release it DECLARES, fetched
      # once from PURL as obographs JSON (hp ~22 MB, mondo ~100 MB). Cache it so a re-run
      # does not re-download; the key follows the mapping files because the declared
      # release is written in their headers.
      - name: Cache pinned ontology releases
        uses: actions/cache@v4
        with:
          path: .ontology-cache
          key: ontology-releases-${{ hashFiles('mappings/*.sssom.tsv') }}
          restore-keys: ontology-releases-

      - name: Validate mappings (CLI, strict HPO check)
        run: uv run b2ai-ingest validate-mappings --strict-ontology

      - name: Test the validator + negative controls
        run: uv run pytest tests/test_sssom_mappings.py -q
