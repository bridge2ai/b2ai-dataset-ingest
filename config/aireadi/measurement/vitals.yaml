# Mapping: AI-READI clinical_data/measurement.csv, vitals and anthropometrics
#          -> MeasurementObservation (IR)
#
# 12 items. Blood pressure and pulse are each taken TWICE and the two readings share one
# OMOP concept (3004249 backs both systolic readings, 3012888 both diastolic, 4239408 both
# pulse), so `description` is what keeps them distinguishable once they carry the same LOINC
# assay -- without it the pair is indistinguishable in the emitted packet. This is also the
# reason the item key is the source variable and never the concept id.
#
# SOURCES, per item, marked in the comments below:
#   [syn] the VUMC synthetic AI-READI release (data/synthetic/aireadi/) -- 8 items.
#   [xw]  AI-READI's published CC-BY-4.0 crosswalk (scripts/fetch_aireadi_crosswalk.sh) --
#         the 4 second-reading items, which the synthetic release does not ship.
#
# LOINC codes were verified by exact-code lookup against the NLM Clinical Table LOINC
# service on 2026-09-09 -- the same route config/voice/questionnaire/phq9.yaml used. They
# are NOT taken from the AI-READI crosswalk, which is a candidate generator rather than an
# oracle: it gives bp1_sysbp_vsorres `LOINC:2403450`, for which NLM returns nothing.
#
# LOINC is deliberately absent from mappings/*.sssom.tsv because oaklib has no usable LOINC
# build (`sqlite:obo:loinc` resolves to a 0-byte database), so a LOINC mapping set would sit
# behind an anti-hallucination gate that cannot check it.
#
# No reference ranges: these rows carry no range_low/range_high.

table: measurement
delimiter: ","
id_column: person_id
key_column: measurement_source_value
date_column: measurement_datetime
visit_column: visit_occurrence_id
value_columns: [value_as_number]

measures:
  bmi_vsorres:
    assay: { id: "LOINC:39156-5", label: "Body mass index (BMI) [Ratio]" }   # [syn] 4245997
    unit: { id: "UCUM:kg/m2", label: "kg/m2" }
  bp1_sysbp_vsorres:
    assay: { id: "LOINC:8480-6", label: "Systolic blood pressure" }          # [syn] 3004249, shared with bp2
    unit: { id: "UCUM:mm[Hg]", label: "mmHg" }
    description: "First reading"
  bp1_diabp_vsorres:
    assay: { id: "LOINC:8462-4", label: "Diastolic blood pressure" }         # [syn] 3012888, shared with bp2
    unit: { id: "UCUM:mm[Hg]", label: "mmHg" }
    description: "First reading"
  bp2_sysbp_vsorres:
    assay: { id: "LOINC:8480-6", label: "Systolic blood pressure" }          # [xw]  same concept as bp1
    unit: { id: "UCUM:mm[Hg]", label: "mmHg" }
    description: "Second reading"
  bp2_diabp_vsorres:
    assay: { id: "LOINC:8462-4", label: "Diastolic blood pressure" }         # [xw]  same concept as bp1
    unit: { id: "UCUM:mm[Hg]", label: "mmHg" }
    description: "Second reading"
  pulse_vsorres:
    assay: { id: "LOINC:8867-4", label: "Heart rate" }                       # [xw]  4239408, shared
    unit: { id: "UCUM:/min", label: "beats per minute" }
    description: "First reading"
  pulse_vsorres_2:
    assay: { id: "LOINC:8867-4", label: "Heart rate" }                       # [xw]  same concept
    unit: { id: "UCUM:/min", label: "beats per minute" }
    description: "Second reading"
  height_vsorres:
    assay: { id: "LOINC:8302-2", label: "Body height" }                      # [syn] 3036277
    unit: { id: "UCUM:cm", label: "cm" }
  weight_vsorres:
    assay: { id: "LOINC:29463-7", label: "Body weight" }                     # [syn] 3025315
    unit: { id: "UCUM:kg", label: "kg" }
  waist_vsorres:
    assay: { id: "LOINC:8280-0", label: "Waist Circumference at umbilicus by Tape measure" }  # [syn] 4172830
    unit: { id: "UCUM:cm", label: "cm" }
  hip_vsorres:
    assay: { id: "b2ai:measurement.hip_vsorres", label: "Hip circumference" }  # [syn] 4111665 -- NLM has
    unit: { id: "UCUM:cm", label: "cm" }                                       #   only PhenX protocol codes,
                                                                               #   not a plain measure
  whr_vsorres:
    assay: { id: "b2ai:measurement.whr_vsorres", label: "Waist to hip ratio" }  # [syn] 44809433
    unit: { id: "UCUM:1", label: "ratio" }
