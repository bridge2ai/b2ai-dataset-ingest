# Mapping: AI-READI clinical_data/measurement.csv, families import_* and lbscat_* -> MeasurementObservation (IR)
#
# 29 central-lab analytes (import_*) and 9 site CBC items (lbscat_*).
#
# Reference ranges are opt-in per FAMILY; see `reference_ranges` below.
#
# ASSAY IDENTITY. Items with a verified LOINC code carry it; the rest carry a project-local
# `b2ai:measurement.<item>` id with a curated label. That stopgap is the documented VHI-10
# precedent already shipping in config/voice/questionnaire/vhi10.yaml (`b2ai:vhi10.total`),
# and it decouples delivery from the LOINC curation tranche: a later PR replaces `id:` in
# place and nothing else changes. A `TODO` id would be SKIPPED at read time, which is why
# none appears here.
#
# LOINC codes below were verified by exact-code lookup against the NLM Clinical Table LOINC
# service on 2026-09-09 -- the same route config/voice/questionnaire/phq9.yaml used. LOINC
# is deliberately absent from mappings/*.sssom.tsv: oaklib has no usable LOINC build
# (`sqlite:obo:loinc` resolves to a 0-byte database and raises OperationalError), so a LOINC
# SSSOM set would sit behind an anti-hallucination gate that cannot actually check it.

# Reference intervals are a property of this FAMILY, not of individual items: a lab result
# has a normal range, while a cognitive subscore's 0-3 bound is a *scoring* range and not a
# reference interval at all. Declaring it once here rather than per item means no item
# carries an observation about which particular analytes a given release happens to report a
# range for -- an item with no bounds simply emits none.
#
# A range is emitted only when BOTH bounds are present: ReferenceRange.low/.high are proto3
# doubles with no field presence, so a one-sided range reads back as "the normal range is 39
# to 0". One-sided rows are dropped and counted. The intervals are per ROW, not per item --
# OMOP carries them on the row precisely because they can be age- and sex-specific.
reference_ranges: true

table: measurement
delimiter: ","
id_column: person_id
key_column: measurement_source_value
date_column: measurement_datetime
visit_column: visit_occurrence_id
value_columns: [value_as_number]

measures:
  import_albumin:
    assay: { id: "LOINC:1751-7", label: "Albumin [Mass/volume] in Serum or Plasma" }
    unit: { id: "UCUM:g/dL", label: "g/dL" }
  import_alkaline_phosphatase:
