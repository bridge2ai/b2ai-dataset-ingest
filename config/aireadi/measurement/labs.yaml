  import_urine_albumin:
    assay: { id: "b2ai:measurement.import_urine_albumin", label: "Albumin [Mass/volume] in Urine" }   # 3012516 -- source unit cell is mojibake '_g/mL' for ug/mL
    unit: { id: "UCUM:ug/mL", label: "ug/mL" }
  import_urine_creatinine:
    assay: { id: "b2ai:measurement.import_urine_creatinine", label: "Creatinine [Mass/volume] in Urine" }   # 3017250 -- same mojibake
    unit: { id: "UCUM:ug/mL", label: "ug/mL" }
  lbscat_a1c:
