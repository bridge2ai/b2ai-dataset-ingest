  # -- photopic contrast sensitivity ---------------------------------------------------
  plcsodlog:
    assay: { id: "b2ai:measurement.plcsodlog", label: "Photopic log contrast sensitivity, right eye" }
    unit: { id: "UCUM:1", label: "log contrast sensitivity" }
