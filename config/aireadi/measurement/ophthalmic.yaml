# Present in the published crosswalk for the BCVA form but NOT measurements: two "not done"
# flags, two sign modifiers for the autorefraction sphere, and the form-completion method.
# Named here so the inventory (config/aireadi/inventory.tsv) records them as a decision.
drop_rules:
  "viaod_nd": "BCVA not done, right eye: an administrative flag, not a measurement."
  "viaos_nd": "BCVA not done, left eye: an administrative flag, not a measurement."
  "viaodsph_m": "Sign (+/-) modifier for the right-eye sphere; the signed value is in viaodsph."
  "viaossph_m": "Sign (+/-) modifier for the left-eye sphere; the signed value is in viaossph."
  "viaomthd": "Method used to complete the BCVA form (EVA / ETDRS): acquisition provenance."
